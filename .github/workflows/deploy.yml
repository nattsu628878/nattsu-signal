name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # articleページはnote/QiitaのフィードをCORS制約のためビルド時に取得している。
  # 新着記事を反映するには、投稿後にここから手動でリビルドする（Actions → Run workflow）。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
